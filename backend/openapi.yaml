openapi: 3.1.0
info:
  title: Eneba-style marketplace API
  version: 0.1.0
  description: |
    REST API for the digital-key marketplace. Money is always integer cents (EUR).
    A product's price is its cheapest active offer that still has an available key; stock = available keys.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Liveness and database check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
        '503': { description: Database unreachable }
  /products:
    get:
      summary: Store listing with filters, sort and typo-tolerant name search
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Name search (substring or pg_trgm word similarity >= 0.3)' }
        - { name: platform, in: query, schema: { type: string }, description: 'Comma-separated, e.g. "PC,Nintendo Switch"' }
        - { name: region, in: query, schema: { type: string }, description: Comma-separated }
        - { name: genre, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 }, description: Cents }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 }, description: Cents }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: onSale, in: query, schema: { type: boolean }, description: Only products whose best offer is discounted }
        - name: sort
          in: query
          description: Defaults to relevance when q is set, otherwise newest
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest, name, discount] }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
      responses:
        '200':
          description: One page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/filters:
    get:
      summary: Filter facets (with product counts) and price range for the Store sidebar
      responses:
        '200':
          description: Facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Filters' }
  /products/{slug}:
    get:
      summary: Product page with all active offers (cheapest in-stock first)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } }
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /search/suggest:
    get:
      summary: Typo-tolerant autocomplete for the global search box (max 8 results)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: 'Fewer than 2 characters returns no items' }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
  /home:
    get:
      summary: Homepage layout. Active blocks in display order, each filled server-side by the provider for its type
      description: |
        Block types: banners (itemKind=banner), best_sellers, deals, new_releases, genre (itemKind=product).
        Blocks whose type has no provider or that resolve to zero items are omitted. Cached publicly for 60 s.
      responses:
        '200':
          description: Layout
          headers:
            Cache-Control: { schema: { type: string, example: 'max-age=60, public' } }
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks: { type: array, items: { $ref: '#/components/schemas/HomeBlock' } }
  /auth/register:
    post:
      summary: Create an account and sign in (sets the httpOnly auth cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 180 }
                password: { type: string, minLength: 8, maxLength: 128 }
                displayName: { type: string, maxLength: 80, description: 'Defaults to the part of the email before @' }
      responses:
        '201':
          description: 'Account created; sets cookie eneba_auth=<jwt> (HttpOnly, SameSite=Lax)'
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '409':
          description: Email already registered (error = email_taken)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '422':
          description: Invalid fields (error = validation_failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /auth/login:
    post:
      summary: Sign in with email + password (sets the httpOnly auth cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          description: Wrong email or password (error = invalid_credentials; same response for unknown emails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      summary: Sign out (expires the auth cookie)
      responses:
        '204':
          description: Signed out
  /auth/me:
    get:
      summary: The signed-in user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          description: Not signed in or session expired (error = unauthorized)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders:
    post:
      summary: Place an order and reserve keys for 15 minutes
      description: |
        Reserves one license key per unit (`FOR UPDATE SKIP LOCKED`, so concurrent buyers never get the same key).
        Lines for the same offer are merged. Pending orders older than 15 minutes are cancelled and their keys released.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created with status `pending`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401':
          description: Not signed in (error = unauthorized)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `offer_unavailable` (unknown or inactive offer; extra field `offerId`) or
            `out_of_stock` (not enough free keys; extra fields `offerId`, `available`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutError' }
        '422':
          description: Invalid body (error = validation_failed) or `mixed_currency`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    get:
      summary: Order history of the signed-in user (newest first)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Orders; key codes are included only for paid orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '401':
          description: Not signed in (error = unauthorized)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{reference}:
    parameters:
      - $ref: '#/components/parameters/OrderReference'
    get:
      summary: One order of the signed-in user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Order (with key codes when paid)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401':
          description: Not signed in (error = unauthorized)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown order or an order of another user (error = not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /orders/{reference}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderReference'
    post:
      summary: Pay a pending order with the simulated payment provider
      description: |
        Idempotent: repeating a request with the same `Idempotency-Key` returns the stored result
        (same status code and body) with header `Idempotent-Replayed: true`, and never charges twice.
        Card number `4000 0000 0000 0002` is declined (402); any other value, or no body, succeeds.
        After a decline the order stays `pending` and can be retried with a new key.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Client-generated key, unique per payment attempt (8-64 chars, [A-Za-z0-9_-])'
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cardNumber: { type: string, example: '4242 4242 4242 4242' }
      responses:
        '200':
          description: Paid; items include the delivered key codes
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present when this is a replay }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '400':
          description: Missing or malformed Idempotency-Key (error = invalid_idempotency_key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in (error = unauthorized)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Card declined (error = payment_declined); the order is still pending
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Present when this is a replay }
          content:
            application/json:
              schema:
                type: object
                required: [error, message, order]
                properties:
                  error: { type: string, example: payment_declined }
                  message: { type: string }
                  order: { $ref: '#/components/schemas/Order' }
        '404':
          description: Unknown order or an order of another user (error = not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            `order_already_paid` (a new key on a paid order), `order_not_payable` (cancelled or failed; extra field `status`)
            or `reservation_expired` (the 15-minute reservation ran out)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutError' }
        '422':
          description: The Idempotency-Key was already used for a different order (error = idempotency_key_reused)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    OrderReference:
      name: reference
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z0-9-]{1,20}$', example: ENB-7K2M9Q4XHP }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: eneba_auth
      description: HS256 JWT (7-day expiry) set by /auth/register and /auth/login. HttpOnly, SameSite=Lax, Secure in production.
  schemas:
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    ValidationError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: validation_failed }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Field name -> human-readable problem
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: invalid_query }
        message: { type: string }
    HomeBlock:
      type: object
      required: [id, type, title, itemKind, settings, items]
      properties:
        id: { type: integer }
        type: { type: string, enum: [banners, best_sellers, deals, new_releases, genre] }
        title: { type: string, example: Best sellers }
        itemKind: { type: string, enum: [product, banner], description: 'Tells the client how to render items' }
        settings:
          type: object
          additionalProperties: true
          description: 'Provider settings, e.g. {"limit": 12} or {"genre": "RPG", "limit": 12}'
        items:
          type: array
          items:
            oneOf:
              - { $ref: '#/components/schemas/ProductCard' }
              - { $ref: '#/components/schemas/Banner' }
    Banner:
      type: object
      required: [id, title, subtitle, imageUrl, linkUrl]
      properties:
        id: { type: integer }
        title: { type: string, example: Spring Sale }
        subtitle: { type: [string, 'null'] }
        imageUrl: { type: string, format: uri }
        linkUrl: { type: string, example: /product/elden-ring-pc-global }
    ProductCard:
      type: object
      required: [id, slug, name, coverUrl, platform, region, genres, releaseDate, priceCents, originalPriceCents, discountPercent, currency, offerCount, inStock]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        coverUrl: { type: [string, 'null'] }
        platform: { type: string, example: PC }
        region: { type: string, example: Global }
        genres: { type: array, items: { type: string } }
        releaseDate: { type: [string, 'null'], format: date }
        priceCents: { type: [integer, 'null'], description: 'Cheapest in-stock offer; null when out of stock' }
        originalPriceCents: { type: [integer, 'null'] }
        discountPercent: { type: [integer, 'null'] }
        currency: { type: string, example: EUR }
        offerCount: { type: integer, description: Number of in-stock offers }
        inStock: { type: boolean }
    ProductPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    Offer:
      type: object
      required: [id, priceCents, originalPriceCents, discountPercent, currency, stock, inStock, seller]
      properties:
        id: { type: integer }
        priceCents: { type: integer }
        originalPriceCents: { type: [integer, 'null'] }
        discountPercent: { type: [integer, 'null'] }
        currency: { type: string }
        stock: { type: integer }
        inStock: { type: boolean }
        seller:
          type: object
          required: [id, name, slug, rating]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
            rating: { type: number, example: 4.8 }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [description, offers]
          properties:
            description: { type: string }
            offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
    Facet:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    Filters:
      type: object
      required: [platforms, regions, genres, price, sorts]
      properties:
        platforms: { type: array, items: { $ref: '#/components/schemas/Facet' } }
        regions: { type: array, items: { $ref: '#/components/schemas/Facet' } }
        genres: { type: array, items: { $ref: '#/components/schemas/Facet' } }
        price:
          type: object
          properties:
            minCents: { type: integer }
            maxCents: { type: integer }
        sorts: { type: array, items: { type: string } }
    CheckoutError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: out_of_stock }
        message: { type: string }
        offerId: { type: integer, description: 'offer_unavailable, out_of_stock' }
        available: { type: integer, description: 'out_of_stock: keys still free for that offer' }
        status: { type: string, description: 'order_not_payable: current order status' }
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [offerId, quantity]
            properties:
              offerId: { type: integer, minimum: 1 }
              quantity: { type: integer, minimum: 1, maximum: 10, description: 'Max 10 per offer after merging duplicate lines' }
    OrderItem:
      type: object
      required: [offerId, productSlug, productName, coverUrl, platform, region, sellerName, unitPriceCents, quantity, keys]
      properties:
        offerId: { type: integer }
        productSlug: { type: string }
        productName: { type: string }
        coverUrl: { type: [string, 'null'] }
        platform: { type: string }
        region: { type: string }
        sellerName: { type: string }
        unitPriceCents: { type: integer, description: Price at the time of ordering }
        quantity: { type: integer }
        keys: { type: array, items: { type: string }, description: 'License key codes; empty unless the order is paid' }
    Order:
      type: object
      required: [reference, status, totalCents, currency, createdAt, paidAt, expiresAt, items]
      properties:
        reference: { type: string, example: ENB-7K2M9Q4XHP }
        status: { type: string, enum: [pending, paid, cancelled, failed] }
        totalCents: { type: integer }
        currency: { type: string, example: EUR }
        createdAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'When the key reservation ends; null unless pending' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
    OrderEnvelope:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
