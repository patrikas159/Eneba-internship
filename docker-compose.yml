services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eneba
      POSTGRES_USER: eneba
      POSTGRES_PASSWORD: eneba # local dev only; production uses Neon credentials via env vars
    ports:
      - "127.0.0.1:5433:5432" # host 5433 (5432 is used by another local project)
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eneba -d eneba"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:80" # http://localhost:8080 (8000 is used by another local process)
    volumes:
      - ./backend:/app # live code reload in dev
    depends_on:
      db:
        condition: service_healthy # don't start PHP until Postgres accepts connections
    healthcheck:
      # /api/health runs SELECT 1 through Doctrine -> healthy only if Symfony can reach the DB
      test: ["CMD", "curl", "-fsS", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
